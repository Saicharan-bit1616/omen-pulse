[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omen-pulse"
version = "0.1.0"
description = "Linux-native hardware controller for the HP OMEN key"
requires-python = ">=3.10"
dependencies = [
    "evdev",
]

[tool.setuptools.packages.find]
where = ["src"]
